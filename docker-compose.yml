version: '3.8'

services:
  # --- MySQL Database ---
  mysql:
    image: mysql:8.0
    container_name: paypal_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: paypal_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

  # --- Redis Cache ---
  redis:
    image: redis:alpine
    container_name: paypal_redis
    ports:
      - "6379:6379"
    restart: always

  # --- Zookeeper (Required for Kafka) ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.1
    container_name: paypal_zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # --- Kafka Broker ---
  kafka:
    image: confluentinc/cp-kafka:7.4.1
    container_name: paypal_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    restart: always

volumes:
  mysql_data: